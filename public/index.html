<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión · Recupero ABC Asistencias</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📞</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#13303B; --ink2:#2B4C57; --muted:#5E7470; --paper:#EEF2F1; --surface:#FFFFFF; --line:#D3DDDA; --soft:#F6F8F8;
  --green:#17775F; --green-bg:#E3F1EC; --amber:#A85C17; --amber-bg:#F8EDE0; --red:#A83232; --red-bg:#F7E4E4;
  --vault:#1C2940; --vault2:#26365A; --focus:#2F7FD1;
  --r-s:6px; --r-m:10px;
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hidden{display:none!important}
h1,h2,h3{margin:0;line-height:1.2}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:var(--ink2)}
.btn.danger{color:var(--red);border-color:#e3bcbc}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=password],input[type=number],input[type=datetime-local],input[type=search],select,textarea{
  border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;background:var(--surface);width:100%}
textarea{resize:vertical;min-height:64px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:4px}

/* Top bar */
header.top{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--ink);color:#fff;flex-wrap:wrap}
header.top .brand{font-weight:800;font-size:16px;letter-spacing:-.01em}
header.top .brand span{font-weight:400;opacity:.7;margin-left:6px}
header.top nav{display:flex;gap:2px;flex-wrap:wrap}
header.top nav button{background:transparent;border:0;color:#cfe0de;padding:7px 12px;border-radius:var(--r-s);cursor:pointer;font-weight:600}
header.top nav button.on{background:rgba(255,255,255,.14);color:#fff}
header.top .who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px}
header.top .who .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3);padding:5px 10px}
.stat-inline{display:flex;gap:14px;font-size:13px;color:#cfe0de}
.stat-inline b{color:#fff;font-size:15px;margin-right:3px}

main{padding:20px;max-width:1440px;margin:0 auto}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:28px;width:min(380px,100%)}
.login h1{font-size:22px;margin-bottom:4px}
.login p{margin:0 0 20px}
.login .row{margin-bottom:14px}

/* Operador */
.op-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.op-bar select{width:auto;min-width:200px}
.op-bar .search{display:flex;gap:6px;margin-left:auto}
.op-bar .search input{width:240px}
.op-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,1fr);gap:18px;align-items:start}
@media (max-width:980px){.op-grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.panel > .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.panel > .bd{padding:16px 18px}

.ficha-head{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.ficha-head .name{font-size:26px;font-weight:800;letter-spacing:-.02em}
.ficha-head .meta{display:flex;gap:18px;margin-top:6px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.ficha-head .meta b{color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);border:1px solid var(--line)}
.chip.g{background:var(--green-bg);border-color:#bfe0d4;color:var(--green)}
.chip.a{background:var(--amber-bg);border-color:#ecd2b3;color:var(--amber)}
.chip.r{background:var(--red-bg);border-color:#ebc5c5;color:var(--red)}
.sec{padding:14px 20px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:10px}

.tel{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:6px}
.tel.sel{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.tel.inv{opacity:.55;text-decoration:line-through}
.tel .n{font-size:17px;font-weight:700;letter-spacing:.01em}
.tel .o{font-size:12px;color:var(--muted)}
.tel .act{margin-left:auto;display:flex;gap:4px}
.tel .act .btn{padding:4px 8px;font-size:12px}
.tel input[type=radio]{accent-color:var(--ink)}
.add-tel{display:flex;gap:6px;margin-top:8px}

.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.notas{font-size:14px;background:var(--soft);border-radius:var(--r-s);padding:10px 12px;white-space:pre-wrap}

.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13px}
.hist li:first-child{border-top:0}
.hist .when{color:var(--muted)}
.hist .t{font-weight:700}
.hist .t.efectivo{color:var(--green)} .hist .t.no_efectivo{color:var(--amber)}

/* Tipificación */
.tip-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tip-col h4{margin:0 0 8px;font-size:13px;font-weight:800;padding-bottom:6px;border-bottom:3px solid}
.tip-col.ne h4{color:var(--amber);border-color:var(--amber)}
.tip-col.ef h4{color:var(--green);border-color:var(--green)}
.tip-btn{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:5px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);cursor:pointer;font-weight:500;font-size:14px}
.tip-col.ne .tip-btn:hover{border-color:var(--amber)}
.tip-col.ef .tip-btn:hover{border-color:var(--green)}
.tip-col.ne .tip-btn.on{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:700}
.tip-col.ef .tip-btn.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.tip-btn .cl{float:right;font-size:11px;opacity:.7;font-weight:600;margin-top:2px}
.subs{display:grid;gap:6px;margin:12px 0 0}
.sub-btn{padding:9px 12px;border:1px dashed var(--green);border-radius:var(--r-s);background:var(--green-bg);cursor:pointer;text-align:left;font-weight:600;color:var(--green)}
.sub-btn.on{background:var(--green);color:#fff;border-style:solid}
.tip-extra{margin-top:14px;display:grid;gap:10px}
.tip-foot{display:flex;gap:8px;margin-top:14px;align-items:center}
.tip-foot .btn.primary{flex:1;padding:11px}
.warn{background:var(--amber-bg);color:var(--amber);border-radius:var(--r-s);padding:8px 10px;font-size:13px;font-weight:600}

/* Bóveda TC */
.vault{background:var(--vault);color:#E8EEF8;border-radius:var(--r-m);padding:18px;margin-top:18px;position:relative;overflow:hidden}
.vault::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:22px solid rgba(255,255,255,.04)}
.vault h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.vault p{margin:4px 0 14px;font-size:13px;color:#aab8d0}
.vault label.f{color:#c7d3e8}
.vault input,.vault select{background:var(--vault2);border-color:#3b4e77;color:#fff}
.vault input::placeholder{color:#8797b5}
.vault .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.vault .btn{background:#E8EEF8;color:var(--vault);border:0;width:100%;padding:10px}
.vault .sealed{display:flex;align-items:center;gap:14px;padding:6px 0 2px}
.vault .seal{width:46px;height:46px;border-radius:50%;background:#2E4A7A;display:grid;place-items:center;font-size:22px;flex:none}
.vault .sealed b{font-size:16px;display:block}
.vault .card-no{font-size:22px;letter-spacing:.12em;font-weight:700;margin:4px 0}

.empty{padding:60px 20px;text-align:center}
.empty h2{font-size:22px;margin-bottom:8px}
.empty p{max-width:460px;margin:0 auto 18px;color:var(--muted)}

/* Supervisor */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:2px}
.kpi.hl{background:var(--ink);color:#fff;border-color:var(--ink)} .kpi.hl .l,.kpi.hl .s{color:#b9d0cd}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.filters > div{min-width:150px}
.filters .grow{flex:1}
.bars .row{display:grid;grid-template-columns:170px 1fr 60px;gap:10px;align-items:center;font-size:13px;margin-bottom:6px}
.bars .track{height:16px;background:var(--soft);border-radius:4px;overflow:hidden}
.bars .fill{height:100%;background:var(--ink2)}
.bars .fill.efectivo{background:var(--green)} .bars .fill.no_efectivo{background:var(--amber)} .bars .fill.cerrado{background:#7c8e8a}
.bars .num{text-align:right;font-weight:700}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:700;color:var(--ink2);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--soft)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--soft)}
table.t td.n{text-align:right}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 0 0;font-size:13px}
svg.chart text{font-size:11px;fill:var(--muted);font-family:inherit}

.drawer-bg{position:fixed;inset:0;background:rgba(19,48,59,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;overflow:auto;box-shadow:-8px 0 30px rgba(19,48,59,.2)}
.drawer .bar{display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1;flex-wrap:wrap}

.drop{display:block;margin-top:12px;border:2px dashed var(--line);border-radius:var(--r-m);padding:30px;text-align:center;background:var(--surface);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--ink2);background:var(--soft)}
.map-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;font-size:13px}
.map-list div{padding:6px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.map-list b{display:block}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r-s);z-index:60;font-weight:600;max-width:90vw}
.toast.err{background:var(--red)}
.search-res{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);box-shadow:0 8px 24px rgba(19,48,59,.15);z-index:30;width:360px;max-height:360px;overflow:auto;margin-top:4px;right:0}
.search-res button{display:block;width:100%;text-align:left;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer}
.search-res button:hover{background:var(--soft)}
@media (prefers-reduced-motion:no-preference){ .vault .seal{animation:pop .35s ease-out} @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}} }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ═══════════ Estado y API ═══════════ */
const S = { token: sessionStorage.getItem("tok") || null, user: null, st: null, view: null, rec: null, form: {}, records: null, fuente: "", repFuente: "", repDesde: "", repHasta: "" };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDT = (t) => t ? new Date(t).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
const fmtD = (t) => new Date(t).toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit" });
const pct = (a, b) => b ? (100 * a / b).toFixed(1).replace(".", ",") + "%" : "—";
const fmtTel = (n) => {
  n = String(n);
  const m = n.match(/^(?:54)?9?(11|2\d{2,3}|3\d{2,3})(\d{6,8})$/);
  if (!m) return n;
  return `(${m[1]}) ${m[2].slice(0, m[2].length - 4)}-${m[2].slice(-4)}`;
};
const telHref = (n) => { n = String(n).replace(/^0/, ""); return "tel:" + (n.startsWith("54") ? "+" + n : n.length === 10 ? "+549" + n : n); };

async function API(path, body, method) {
  const r = await fetch("/api/" + path, {
    method: method || (body ? "POST" : "GET"),
    headers: { "content-type": "application/json", ...(S.token ? { authorization: "Bearer " + S.token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json().catch(() => ({ error: "El servidor no respondió bien (" + r.status + ")." }));
  if (r.status === 401 && path !== "login") { S.token = null; sessionStorage.removeItem("tok"); render(); throw new Error(d.error); }
  if (!r.ok) throw new Error(d.error || "Error " + r.status);
  return d;
}
function toast(msg, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : ""); t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2600);
}
async function run(fn, btn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { toast(e.message, true); } finally { if (btn) btn.disabled = false; }
}
const TIPLIST = () => [...S.st.tips.no_efectivo.items.map((i) => ({ ...i, grupo: "no_efectivo" })), ...S.st.tips.efectivo.items.map((i) => ({ ...i, grupo: "efectivo" }))];
const estadoChip = (r) => r.estado === "cerrado" ? `<span class="chip">Cerrado${r.motivoCierre ? ": " + esc(r.motivoCierre) : ""}</span>`
  : r.intentos ? `<span class="chip a">En curso</span>` : `<span class="chip">Sin gestionar</span>`;

/* ═══════════ Render principal ═══════════ */
async function render() {
  const app = $("#app");
  if (!S.token) return renderLogin(app);
  if (!S.st) {
    try { S.st = await API("state"); S.user = S.st.user; } catch (e) { return; }
    S.view = S.view || (S.user.role === "operador" ? "gestion" : "reporte");
  }
  const u = S.user, isAdmin = u.role === "admin", isSup = u.role === "supervisor" || isAdmin, isCli = u.role === "cliente";
  const tabs = u.role === "operador" ? [["gestion", "Gestión"], ["agenda", "Agenda"]]
    : isSup ? [["reporte", "Reporte"], ["base", "Base"], ["cobros", "Cobros"], ["agenda", "Agenda"], ["gestion", "Gestionar"], ["carga", "Cargar base"], ...(isAdmin ? [["config", "Usuarios y configuración"]] : [])]
    : [["reporte", "Reporte"], ["base", "Base"]];
  if (!tabs.some(([k]) => k === S.view)) S.view = tabs[0][0];
  const hoy = S.st.hoy;
  app.innerHTML = `
    <header class="top">
      <div class="brand">ABC Asistencias<span>${esc(S.st.config.campaign.replace(/\s*—\s*ABC Asistencias/i, ""))}</span></div>
      <nav>${tabs.map(([k, l]) => `<button data-v="${k}" class="${S.view === k ? "on" : ""}">${l}</button>`).join("")}</nav>
      <div class="who">
        ${hoy ? `<div class="stat-inline"><span><b>${hoy.gestiones}</b>gestiones hoy</span><span><b>${hoy.contactos}</b>contactos</span><span><b>${hoy.ventas}</b>ventas</span></div>` : ""}
        <span>${esc(u.name)}${u.quincena ? ` · ${u.quincena === 1 ? "1ª" : "2ª"} quincena` : ""}${isAdmin ? ` · <b title="Sin tope diario, sin intervalo entre intentos y con acceso a rellamados futuros">admin · sin reglas</b>` : ""}</span>
        <button class="btn" id="logout">Salir</button>
      </div>
    </header>
    <main id="main"></main>`;
  app.querySelectorAll("header nav button").forEach((b) => b.onclick = () => { S.view = b.dataset.v; render(); });
  $("#logout").onclick = async () => { await API("logout", {}).catch(() => {}); S.token = null; S.st = null; S.rec = null; S.records = null; sessionStorage.removeItem("tok"); render(); };
  const m = $("#main");
  ({ gestion: viewGestion, agenda: viewAgenda, reporte: viewReporte, base: viewBase, cobros: viewCobros, carga: viewCarga, config: viewConfig }[S.view] || viewReporte)(m);
}

function renderLogin(app) {
  app.innerHTML = `
  <div class="login"><form id="lf">
    <h1>Gestión de llamados</h1>
    <p class="muted">Recupero de medio de pago · ABC Asistencias</p>
    <div class="row"><label class="f" for="lu">Usuario</label><input id="lu" type="text" autocomplete="username" required autofocus></div>
    <div class="row"><label class="f" for="lp">Contraseña</label><input id="lp" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" style="width:100%">Ingresar</button>
  </form></div>`;
  $("#lf").onsubmit = (e) => {
    e.preventDefault();
    run(async () => {
      const d = await API("login", { u: $("#lu").value, p: $("#lp").value });
      S.token = d.token; sessionStorage.setItem("tok", d.token); S.st = null; S.view = null; render();
    }, e.submitter);
  };
}
async function refreshState() { try { S.st = await API("state"); S.user = S.st.user; } catch (e) {} }

/* ═══════════ Operador: gestión ═══════════ */
function viewGestion(m) {
  const fuentes = S.st.fuentes || [];
  m.innerHTML = `
    <div class="op-bar">
      <select id="fsel" aria-label="Filtrar cola por fuente"><option value="">Todas las fuentes</option>${fuentes.map((f) => `<option ${S.fuente === f ? "selected" : ""}>${esc(f)}</option>`).join("")}</select>
      <button class="btn primary" id="bnext">${S.rec ? "Siguiente registro" : "Tomar registro"}</button>
      ${S.rec ? `<button class="btn" id="bskip">Liberar sin gestionar</button>` : ""}
      <span class="small muted">Horario de gestión ${S.st.config.horaInicio} a ${S.st.config.horaFin} hs${S.st.enHorario ? "" : ` · <b style="color:var(--red)">ahora fuera de horario</b>`}${S.st.agendaVencida ? ` · <b style="color:var(--amber)">${S.st.agendaVencida} rellamados vencidos</b>` : ""}${S.st.abiertos != null ? ` · ${S.st.abiertos} registros abiertos` : ""}</span>
      <div class="search" style="position:relative">
        <input type="search" id="q" placeholder="Buscar DNI, teléfono o nombre">
        <button class="btn" id="bq">Buscar</button>
        <div id="qres"></div>
      </div>
    </div>
    <div id="work"></div>`;
  $("#fsel").onchange = (e) => S.fuente = e.target.value;
  $("#bnext").onclick = (e) => run(async () => {
    if (S.rec) await API("liberar", { id: S.rec.id }).catch(() => {});
    const d = await API("next", { fuente: S.fuente });
    S.rec = d.record; S.form = {};
    if (!d.record) toast("No hay registros disponibles para llamar ahora.");
    viewGestion(m);
  }, e.target);
  if ($("#bskip")) $("#bskip").onclick = (e) => run(async () => { await API("liberar", { id: S.rec.id }); S.rec = null; S.form = {}; viewGestion(m); }, e.target);
  const doSearch = () => run(async () => {
    const d = await API("buscar", { q: $("#q").value });

}

/* ═══════════ Datos para reporte ═══════════ */
async function loadRecords(force) {
  if (!S.records || force) S.records = (await API("records")).items;
  return S.records;
}
function filtRecs() {
  return (S.records || []).filter((r) => !S.repFuente || (r.fuentes || [r.fuente]).includes(S.repFuente));
}
function histInRange(recs) {
  const d0 = S.repDesde ? new Date(S.repDesde + "T00:00:00").getTime() : 0;
  const d1 = S.repHasta ? new Date(S.repHasta + "T23:59:59").getTime() : Infinity;
  const out = [];
  for (const r of recs) for (const h of r.hist) if (h.grupo !== "sistema" && h.at >= d0 && h.at <= d1) out.push({ ...h, rec: r });
  return out;
}
function filterBar(showDates = true) {
  const fuentes = [...new Set((S.records || []).flatMap((r) => r.fuentes || [r.fuente]))].sort();
  return `<div class="filters">
    <div><label class="f" for="rf">Fuente</label><select id="rf"><option value="">Todas</option>${fuentes.map((f) => `<option ${S.repFuente === f ? "selected" : ""}>${esc(f)}</option>`).join("")}</select></div>
    ${showDates ? `<div><label class="f" for="rd">Gestiones desde</label><input type="date" id="rd" value="${S.repDesde}"></div>
    <div><label class="f" for="rh">Hasta</label><input type="date" id="rh" value="${S.repHasta}"></div>` : ""}
    <div class="grow"></div>
    <button class="btn" id="bref">Actualizar datos</button>
    <button class="btn" id="bexp">Exportar Excel</button>
    ${["supervisor", "admin"].includes(S.user.role) ? `<button class="btn" id="bexptc">Exportar ventas con tarjeta</button>` : ""}
  </div>`;
}
function bindFilters(m, rerender) {
  $("#rf").onchange = (e) => { S.repFuente = e.target.value; rerender(m); };
  if ($("#rd")) $("#rd").onchange = (e) => { S.repDesde = e.target.value; rerender(m); };
  if ($("#rh")) $("#rh").onchange = (e) => { S.repHasta = e.target.value; rerender(m); };
  $("#bref").onclick = (e) => run(async () => { await loadRecords(true); rerender(m); }, e.target);
  $("#bexp").onclick = () => exportExcel();
  if ($("#bexptc")) $("#bexptc").onclick = (e) => run(exportTC, e.target);
}
function bars(rows, cls) {
  const max = Math.max(1, ...rows.map((r) => r[1]));
  return `<div class="bars">${rows.map(([l, v, c]) => `<div class="row"><span>${esc(l)}</span><div class="track"><div class="fill ${c || cls || ""}" style="width:${(100 * v / max).toFixed(1)}%"></div></div><span class="num">${v}</span></div>`).join("") || `<p class="muted small">Sin datos.</p>`}</div>`;
}
function dayChart(hist) {
  const by = {};
  for (const h of hist) { const k = new Date(h.at).toISOString().slice(0, 10); (by[k] ||= { ef: 0, ne: 0 }); h.grupo === "efectivo" ? by[k].ef++ : by[k].ne++; }
  const days = Object.keys(by).sort().slice(-31);
  if (!days.length) return `<p class="muted small">Sin gestiones en el período.</p>`;
  const W = 640, H = 200, pad = 26, bw = Math.min(28, (W - pad * 2) / days.length - 4);
  const max = Math.max(...days.map((d) => by[d].ef + by[d].ne));
  const y = (v) => (H - 30) * v / max;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gestiones por día">
    ${days.map((d, i) => { const x = pad + i * ((W - pad * 2) / days.length); const ne = y(by[d].ne), ef = y(by[d].ef);
      return `<g><title>${d.slice(8)}/${d.slice(5, 7)}: ${by[d].ef} efectivas, ${by[d].ne} no efectivas</title>
      <rect x="${x}" y="${H - 20 - ne}" width="${bw}" height="${ne}" fill="#A85C17"/>
      <rect x="${x}" y="${H - 20 - ne - ef}" width="${bw}" height="${ef}" fill="#17775F"/>
      <text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${d.slice(8)}/${d.slice(5, 7)}</text>
      <text x="${x + bw / 2}" y="${H - 24 - ne - ef}" text-anchor="middle">${by[d].ef + by[d].ne}</text></g>`; }).join("")}
  </svg><div class="small muted" style="margin-top:6px"><span style="color:var(--green)">■</span> Efectivas &nbsp; <span style="color:var(--amber)">■</span> No efectivas</div>`;
}

async function viewReporte(m) {
  if (!S.records) { m.innerHTML = `<p class="muted">Cargando datos…</p>`; try { await loadRecords(); } catch (e) { return; } }
  const recs = filtRecs(), hist = histInRange(recs);
  const gest = recs.filter((r) => r.intentos > 0), cont = recs.filter((r) => r.contactado);
  const ventas = recs.filter((r) => r.ultima?.k === "venta");
  const cerr = recs.filter((r) => r.estado === "cerrado");
  const tope = cerr.filter((r) => r.motivoCierre === "Tope de intentos sin contacto");
  const agend = recs.filter((r) => r.estado !== "cerrado" && r.agenda);
  const hEf = hist.filter((h) => h.grupo === "efectivo");
  const hV = hist.filter((h) => h.k === "venta");
  const avgInt = gest.length ? (gest.reduce((a, r) => a + r.intentos, 0) / gest.length).toFixed(1).replace(".", ",") : "—";

  // Pipeline: último resultado de cada registro
  const pipe = {};
  for (const r of recs) { const k = r.ultima ? r.ultima.label : "Sin gestionar"; pipe[k] = (pipe[k] || 0) + 1; }
  const tipOrder = ["Sin gestionar", ...TIPLIST().map((t) => t.label)];
  const tipGroup = Object.fromEntries(TIPLIST().map((t) => [t.label, t.grupo]));
  const pipeRows = tipOrder.filter((k) => pipe[k]).map((k) => [k, pipe[k], tipGroup[k]]);
  // Tipificaciones del período
  const tp = {}; for (const h of hist) tp[h.label] = (tp[h.label] || 0) + 1;
  const tpRows = tipOrder.filter((k) => tp[k]).map((k) => [k, tp[k], tipGroup[k]]);
  // Por operador
  const ops = {};
  for (const h of hist) { const o = (ops[h.byName] ||= { g: 0, ef: 0, v: 0, q: new Set() }); o.g++; if (h.grupo === "efectivo") o.ef++; if (h.k === "venta") o.v++; if (h.q) o.q.add(h.q); }
  // Ventas por producto
  const vp = {}; for (const h of hV) vp[h.sub || "Sin detalle"] = (vp[h.sub || "Sin detalle"] || 0) + 1;
  // Contactabilidad por franja
  const c0 = S.st.config.horaInicio, c1 = S.st.config.horaFin, fr = {};
  for (let x = c0; x < c1; x++) fr[`${x} a ${x + 1} hs`] = [0, 0];
  fr["Fuera de horario"] = [0, 0];
  for (const h of hist) { const hr = new Date(h.at - 3 * 3600e3).getUTCHours(); const k = hr >= c0 && hr < c1 ? `${hr} a ${hr + 1} hs` : "Fuera de horario"; fr[k][0]++; if (h.grupo === "efectivo") fr[k][1]++; }
  if (!fr["Fuera de horario"][0]) delete fr["Fuera de horario"];
  // Por fuente
  const fu = {};
  for (const r of S.records) for (const f of r.fuentes || [r.fuente]) { const o = (fu[f] ||= { n: 0, g: 0, c: 0, v: 0, cerr: 0 }); o.n++; if (r.intentos) o.g++; if (r.contactado) o.c++; if (r.ultima?.k === "venta") o.v++; if (r.estado === "cerrado") o.cerr++; }

  m.innerHTML = `${filterBar()}
  <div class="kpis">
    <div class="kpi"><div class="v">${recs.length}</div><div class="l">Registros en base</div><div class="s">${recs.length - gest.length} sin gestionar</div></div>
    <div class="kpi"><div class="v">${gest.length}</div><div class="l">Gestionados</div><div class="s">${pct(gest.length, recs.length)} de la base · ${avgInt} intentos prom.</div></div>
    <div class="kpi"><div class="v">${cont.length}</div><div class="l">Contactados</div><div class="s">Contactabilidad ${pct(cont.length, gest.length)}</div></div>
    <div class="kpi hl"><div class="v">${ventas.length}</div><div class="l">Ventas (medio de pago recuperado)</div><div class="s">Conversión ${pct(ventas.length, cont.length)} sobre contactados</div></div>
    <div class="kpi"><div class="v">${cerr.length}</div><div class="l">Cerrados</div><div class="s">${tope.length} por tope de ${S.st.config.maxIntentos} intentos</div></div>
    <div class="kpi"><div class="v">${agend.length}</div><div class="l">Rellamados pendientes</div><div class="s">${agend.filter((r) => r.agenda.at <= Date.now()).length} vencidos</div></div>
    <div class="kpi"><div class="v">${hist.length}</div><div class="l">Gestiones en el período</div><div class="s">${hEf.length} efectivas · ${hV.length} ventas</div></div>
  </div>
  <div class="panel" style="margin-bottom:18px"><div class="hd"><h3>Gestiones por día</h3></div><div class="bd">${dayChart(hist)}</div></div>
  <div class="grid2">
    <div class="panel"><div class="hd"><h3>Estado actual de la base (último resultado)</h3></div><div class="bd">${bars(pipeRows)}</div></div>
    <div class="panel"><div class="hd"><h3>Tipificaciones del período</h3></div><div class="bd">${bars(tpRows)}</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><div class="hd"><h3>Por operador</h3></div><div class="bd tbl-wrap"><table class="t"><thead><tr><th>Operador</th><th>Quincena</th><th class="n">Gestiones</th><th class="n">Efectivas</th><th class="n">% contacto</th><th class="n">Ventas</th><th class="n">Conv.</th></tr></thead><tbody>
      ${Object.entries(ops).map(([n, o]) => `<tr><td><b>${esc(n)}</b></td><td>${[...o.q].sort().map((q) => q === 1 ? "1ª" : "2ª").join(", ")}</td><td class="n">${o.g}</td><td class="n">${o.ef}</td><td class="n">${pct(o.ef, o.g)}</td><td class="n">${o.v}</td><td class="n">${pct(o.v, o.ef)}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">Sin gestiones en el período.</td></tr>`}
    </tbody></table></div></div>
    <div class="panel"><div class="hd"><h3>Ventas por producto</h3></div><div class="bd">${bars(Object.entries(vp).sort((a, b) => b[1] - a[1]), "efectivo")}</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><div class="hd"><h3>Contactabilidad por hora</h3></div><div class="bd tbl-wrap"><table class="t"><thead><tr><th>Hora</th><th class="n">Gestiones</th><th class="n">Efectivas</th><th class="n">% contacto</th></tr></thead><tbody>
      ${Object.entries(fr).map(([k, [g, e]]) => `<tr><td>${k}</td><td class="n">${g}</td><td class="n">${e}</td><td class="n">${pct(e, g)}</td></tr>`).join("")}
    </tbody></table></div></div>
    <div class="panel"><div class="hd"><h3>Comparativo por fuente</h3></div><div class="bd tbl-wrap"><table class="t"><thead><tr><th>Fuente</th><th class="n">Registros</th><th class="n">Gestionados</th><th class="n">Contactab.</th><th class="n">Ventas</th><th class="n">Conv.</th><th class="n">Cerrados</th></tr></thead><tbody>
      ${Object.entries(fu).map(([k, o]) => `<tr><td><b>${esc(k)}</b></td><td class="n">${o.n}</td><td class="n">${o.g}</td><td class="n">${pct(o.c, o.g)}</td><td class="n">${o.v}</td><td class="n">${pct(o.v, o.c)}</td><td class="n">${o.cerr}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">Sin base cargada.</td></tr>`}
    </tbody></table></div></div>
  </div>`;
  bindFilters(m, viewReporte);
}

/* ═══════════ Carga de base ═══════════ */
const nrm = (h) => String(h).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
function mapCols(headers) {
  const m = { dni: null, nombre: null, apellido: null, tel: [], tc: null, reservadas: [], notas: [], otros: [] };
  for (const h of headers) {
    const n = nrm(h);
    if (!m.dni && /^(dni|documento|nro doc|nro\. doc|doc)$/.test(n)) m.dni = h;
    else if (!m.nombre && /^(nombre|nombre y apellido|nombre completo|cliente|titular)$/.test(n)) m.nombre = h;
    else if (!m.apellido && /^apellido/.test(n)) m.apellido = h;
    else if (/tel|cel|movil|whatsapp|contacto/.test(n)) m.tel.push(h);
    else if (/^(nueva tc|banco|marca|vencimiento|vto|cvv|cod seg)/.test(n)) m.reservadas.push(h);
    else if (!m.tc && /^(tc|tarjeta|nro tarjeta|numero de tarjeta|tc anterior)$/.test(n)) m.tc = h;
    else if (/observ|nota|comentario|^__empty/.test(n)) m.notas.push(h);
    else m.otros.push(h);
  }
  return m;
}
const cellStr = (v) => typeof v === "number" ? (Number.isInteger(v) ? String(v) : v.toFixed(0)) : String(v ?? "").trim();
const maskTC = (s) => { const d = String(s).replace(/\D/g, ""); if (d.length < 10) return d ? "••••" : ""; return d.slice(0, 6) + "•".repeat(d.length - 10) + d.slice(-4); };

function viewCarga(m) {
  m.innerHTML = `
  <div class="panel" style="max-width:980px">
    <div class="hd"><h2 style="font-size:17px">Cargar base</h2></div>
    <div class="bd">
      <p class="muted" style="margin-top:0">Subí un Excel o CSV. El nombre del archivo queda como fuente de esos registros y las cargas del mismo archivo se acumulan. Si un DNI ya existe, se suman los teléfonos nuevos y se conserva toda su gestión.</p>
      <label class="drop" id="drop" for="file"><b>Elegí un archivo o arrastralo acá</b><br><span class="small muted">.xlsx, .xls o .csv</span></label>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" class="hidden">
      <div id="prev" style="margin-top:16px"></div>
    </div>
  </div>
  <div class="panel" style="max-width:980px;margin-top:18px"><div class="hd"><h3>Fuentes cargadas</h3></div><div class="bd" id="fl"><span class="muted small">Cargando…</span></div></div>`;
  const handle = async (file) => {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: "", raw: true });
    if (!rows.length) return toast("El archivo está vacío.", true);
    const headers = Object.keys(rows[0]).length ? [...new Set(rows.flatMap((r) => Object.keys(r)))] : [];
    const map = mapCols(headers);
    if (!map.dni && !map.nombre) return toast("No encontré columnas de DNI ni de nombre. Revisá los encabezados.", true);
    const fuente = file.name.replace(/\.[^.]+$/, "");
    const prepared = rows.map((r) => {
      const notas = map.notas.map((h) => cellStr(r[h])).filter(Boolean).join(" | ");
      const data = {}; for (const h of map.otros) { const v = cellStr(r[h]); if (v) data[h] = v; }
      return {
        dni: cellStr(r[map.dni]), nombre: [cellStr(r[map.nombre]), cellStr(r[map.apellido])].filter(Boolean).join(" "),
        telefonos: map.tel.map((h) => cellStr(r[h]).replace(/\D/g, "")).filter((t) => t.length >= 6),
        tcAnterior: map.tc ? maskTC(cellStr(r[map.tc])) : "", notas, data,
      };
    }).filter((r) => r.dni || r.nombre);
    const conTel = prepared.filter((r) => r.telefonos.length).length;
    $("#prev").innerHTML = `
      <h3 style="font-size:15px;margin-bottom:8px">${esc(file.name)} · ${prepared.length} registros · fuente “${esc(fuente)}”</h3>
      <div class="map-list">
        <div><b>DNI</b>${esc(map.dni || "—")}</div>
        <div><b>Nombre</b>${esc([map.nombre, map.apellido].filter(Boolean).join(" + ") || "—")}</div>
        <div><b>Teléfonos</b>${esc(map.tel.join(", ") || "—")}</div>
        <div><b>Tarjeta anterior (se guarda enmascarada)</b>${esc(map.tc || "—")}</div>
        <div><b>Observaciones previas</b>${esc([...new Set(map.notas.map((h) => h.startsWith("__EMPTY") ? "columnas sin título" : h))].join(", ") || "—")}</div>
        <div><b>Se ignoran (datos de tarjeta nueva)</b>${esc(map.reservadas.join(", ") || "—")}</div>
        <div><b>Otros datos para la ficha</b>${esc(map.otros.join(", ") || "—")}</div>
      </div>
      ${conTel < prepared.length ? `<p class="warn" style="margin-top:10px">${prepared.length - conTel} registros sin teléfono: no salen en la cola hasta que se les agregue uno.</p>` : ""}
      <p class="small muted">Ejemplo: ${esc(prepared[0].nombre)} · DNI ${esc(prepared[0].dni)} · TC ${esc(prepared[0].tcAnterior || "—")}</p>
      <button class="btn primary" id="bup">Cargar ${prepared.length} registros</button>`;
    $("#bup").onclick = (e) => run(async () => {
      let tot = { nuevos: 0, actualizados: 0, omitidos: 0 };
      for (let i = 0; i < prepared.length; i += 400) {
        e.target.textContent = `Cargando ${Math.min(i + 400, prepared.length)} de ${prepared.length}…`;
        const d = await API("upload", { fuente, rows: prepared.slice(i, i + 400) });
        for (const k in tot) tot[k] += d[k];
      }
      $("#prev").innerHTML = `<p><b>Carga terminada.</b> ${tot.nuevos} nuevos, ${tot.actualizados} ya existían (se sumaron teléfonos y datos), ${tot.omitidos} filas vacías.</p>`;
      S.records = null; await refreshState(); listFuentes();
    }, e.target);
  };
  const drop = $("#drop");
  $("#file").onchange = (e) => e.target.files[0] && handle(e.target.files[0]);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); e.dataTransfer.files[0] && handle(e.dataTransfer.files[0]); };
  const listFuentes = async () => {
    const recs = await loadRecords(true).catch(() => []);
    const fu = {}; for (const r of recs) for (const f of r.fuentes || [r.fuente]) { (fu[f] ||= { n: 0, a: 0 }); fu[f].n++; if (r.estado !== "cerrado") fu[f].a++; }
    $("#fl").innerHTML = Object.keys(fu).length ? `<table class="t"><thead><tr><th>Fuente</th><th class="n">Registros</th><th class="n">Abiertos</th></tr></thead><tbody>${Object.entries(fu).map(([k, o]) => `<tr><td>${esc(k)}</td><td class="n">${o.n}</td><td class="n">${o.a}</td></tr>`).join("")}</tbody></table>` : `<p class="muted small">Todavía no hay bases cargadas.</p>`;
  };
  listFuentes();
}

/* ═══════════ Usuarios y configuración ═══════════ */
async function viewConfig(m) {
  const c = S.st.config;
  m.innerHTML = `
  <div class="grid2">
    <div class="panel"><div class="hd"><h3>Reglas de la campaña</h3></div><div class="bd" style="display:grid;gap:12px">
      <div><label class="f" for="cc">Nombre de la campaña</label><input type="text" id="cc" value="${esc(c.campaign)}"></div>
      <div class="grid2" style="margin:0;gap:12px">
        <div><label class="f" for="cm">Tope de intentos sin contacto</label><input type="number" id="cm" min="1" max="20" value="${c.maxIntentos}"></div>
        <div><label class="f" for="ce">Minutos mínimos entre intentos</label><input type="number" id="ce" min="0" max="1440" value="${c.minEntreIntentos}"></div>
        <div><label class="f" for="cl">Minutos de reserva de un registro</label><input type="number" id="cl" min="5" max="120" value="${c.lockMin}"></div>
        <div><label class="f" for="cd">Llamados por día a un mismo registro</label><input type="number" id="cd" min="1" max="10" value="${c.maxDiarios}"></div>
        <div><label class="f" for="chi">Horario de gestión desde (hs)</label><input type="number" id="chi" min="0" max="23" value="${c.horaInicio}"></div>
        <div><label class="f" for="chf">Hasta (hs)</label><input type="number" id="chf" min="1" max="24" value="${c.horaFin}"></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="cq" ${c.quincenaEstricta ? "checked" : ""}> Cada operador gestiona sólo en su quincena (hoy es la ${S.st.quincena === 1 ? "1ª" : "2ª"})</label>
      <button class="btn primary" id="bcfg" style="justify-self:start">Guardar reglas</button>
    </div></div>
    <div class="panel"><div class="hd"><h3>Usuarios</h3></div><div class="bd" id="ul">Cargando…</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><div class="hd"><h3>Auditoría</h3><span class="small muted">cargas, tarjetas vistas y exportadas, cambios</span></div><div class="bd tbl-wrap" id="au" style="max-height:420px;overflow:auto">Cargando…</div></div>
    <div class="panel"><div class="hd"><h3 style="color:var(--red)">Borrar base</h3></div><div class="bd">
      <p class="small muted" style="margin-top:0">Elimina todos los registros, gestiones y tarjetas cargadas. No se puede deshacer. Exportá antes.</p>
      <div style="display:flex;gap:8px"><input type="text" id="rz" placeholder="Escribí BORRAR"><button class="btn danger" id="brz">Borrar todo</button></div>
    </div></div>
  </div>`;
  $("#bcfg").onclick = (e) => run(async () => {
    await API("config", { campaign: $("#cc").value, maxIntentos: $("#cm").value, minEntreIntentos: $("#ce").value, lockMin: $("#cl").value, horaInicio: $("#chi").value, horaFin: $("#chf").value, maxDiarios: $("#cd").value, quincenaEstricta: $("#cq").checked });
    await refreshState(); toast("Reglas guardadas."); render();
  }, e.target);
  $("#brz").onclick = (e) => run(async () => { await API("reset", { confirmar: $("#rz").value }); S.records = null; await refreshState(); toast("Base borrada."); render(); }, e.target);
  const users = (await API("users")).users;
  const row = (u) => `<tr data-u="${esc(u.u)}"><td><input type="text" value="${esc(u.u)}" ${u.u ? "readonly" : ""} class="uu" placeholder="usuario"></td>
    <td><input type="text" value="${esc(u.name || "")}" class="un" placeholder="Nombre visible"></td>
    <td><select class="ur">${["operador", "supervisor", "cliente", "admin"].map((r) => `<option ${u.role === r ? "selected" : ""}>${r}</option>`).join("")}</select></td>
    <td><select class="uq"><option value="">—</option><option value="1" ${u.quincena === 1 ? "selected" : ""}>1ª (1–15)</option><option value="2" ${u.quincena === 2 ? "selected" : ""}>2ª (16–fin)</option></select></td>
    <td><input type="checkbox" class="ua" ${u.activo !== false ? "checked" : ""} aria-label="Activo"></td>
    <td><input type="password" class="up" placeholder="${u.u ? "Sin cambios" : "Contraseña"}" autocomplete="new-password"></td>
    <td><button class="btn us">Guardar</button></td></tr>`;
  $("#ul").innerHTML = `<div class="tbl-wrap"><table class="t"><thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Quincena</th><th>Activo</th><th>Nueva contraseña</th><th></th></tr></thead><tbody id="ub">${users.map(row).join("")}${row({ u: "", role: "operador", activo: true })}</tbody></table></div>`;
  $("#ub").querySelectorAll("tr").forEach((tr) => $(".us", tr).onclick = (e) => run(async () => {
    await API("users", { u: $(".uu", tr).value, name: $(".un", tr).value, role: $(".ur", tr).value, quincena: $(".uq", tr).value, activo: $(".ua", tr).checked, p: $(".up", tr).value });
    toast("Usuario guardado."); viewConfig(m);
  }, e.target));
  const au = (await API("audit")).items;
  $("#au").innerHTML = au.length ? `<table class="t"><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>${au.map((a) => `<tr><td>${fmtDT(a.at)}</td><td>${esc(a.u)}</td><td>${esc(a.accion)}</td><td>${esc(a.detalle)}</td></tr>`).join("")}</tbody></table>` : `<p class="muted small">Sin eventos todavía.</p>`;
}

/* Liberar el registro al cerrar la pestaña */
window.addEventListener("pagehide", () => {
  if (S.rec && S.token) fetch("/api/liberar", { method: "POST", keepalive: true, headers: { "content-type": "application/json", authorization: "Bearer " + S.token }, body: JSON.stringify({ id: S.rec.id }) });
});
render();
</script>
